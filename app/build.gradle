plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    compileSdk 36

    defaultConfig {
        applicationId "xiangze.mmu.rssnewsreader"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.0.92"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation": "$projectDir/schemas".toString()
                ]
            }
        }

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        viewBinding true
    }
    namespace 'xiangze.mmu.rssnewsreader'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.7'
    implementation 'androidx.navigation:navigation-ui:2.9.7'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'com.chimbori.crux:crux:5.1.0'
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.work:work-runtime:2.11.1'
    implementation 'androidx.datastore:datastore:1.2.0'
    implementation 'androidx.datastore:datastore-preferences-rxjava3:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.hilt:hilt-work:1.3.0'
    implementation 'org.unbescape:unbescape:1.1.6.RELEASE'
    implementation 'io.github.cdimascio:essence:0.13.0'
    implementation 'net.dankito.readability4j:readability4j:1.0.8'
    implementation 'android.arch.lifecycle:reactivestreams:1.1.1'
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.work:work-testing:2.11.1'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation "androidx.work:work-testing:2.11.1"

    // Room
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation "androidx.room:room-rxjava3:2.8.4"

    // Hilt
    implementation "com.google.dagger:hilt-android:2.59"
    annotationProcessor "com.google.dagger:hilt-compiler:2.59"
    annotationProcessor 'androidx.hilt:hilt-compiler:1.3.0'

    // RxJava
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    // Language Identifier
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.mlkit:translate:17.0.3'

    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    // AI
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'

    implementation platform('com.google.firebase:firebase-bom:34.8.0')
    implementation 'com.google.firebase:firebase-analytics'

}