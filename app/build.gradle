plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId = "xiangze.mmu.rssnewsreader"
        minSdk = 29
        targetSdk = 37
        versionCode = 1
        versionName = "1.0.2"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation": "$projectDir/schemas".toString()
                ]
            }
        }

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        resConfigs "en"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CRITICAL: Replace with your actual release signing config for Play Store
            // signingConfig signingConfigs.release 
            signingConfig = signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
    }
    namespace = 'xiangze.mmu.rssnewsreader'

    // Recommended: Add x86/x86_64 for better emulator/Chromebook support
    defaultConfig {
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.work:work-rxjava3:2.11.2'
    implementation 'androidx.datastore:datastore:1.2.1'
    implementation 'androidx.datastore:datastore-preferences-rxjava3:1.2.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.hilt:hilt-work:1.3.0'
    implementation 'net.dankito.readability4j:readability4j:1.0.8'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.work:work-testing:2.11.2'
    androidTestImplementation 'androidx.work:work-testing:2.11.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'

    // Room
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.room:room-rxjava3:2.8.4'

    // Hilt
    implementation "com.google.dagger:hilt-android:2.59.2"
    annotationProcessor "com.google.dagger:hilt-compiler:2.59.2"
    annotationProcessor 'androidx.hilt:hilt-compiler:1.3.0'

    // RxJava
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    // Language Identifier
    implementation 'com.google.mlkit:language-id:17.0.6'

    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    // AI
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'

    // Local LLM
    implementation 'com.google.mediapipe:tasks-genai:0.10.35'
    
    // TapTargetView for walkthroughs
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.15.0'

    // Timber for logging
    implementation 'com.jakewharton.timber:timber:5.0.1'
}